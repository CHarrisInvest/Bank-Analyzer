name: Checks

# Unit tests, statement invariants and a full build, on every change.
#
# The invariant audits are the part worth having. This project's data is
# regenerated in CI and committed straight to main, so a generator change that
# quietly mangles labels, borrows another quarter's values or leaves a balance
# sheet that does not foot reaches the site with nobody having looked. The
# audits assert the handful of properties that are wrong at any count; they are
# deliberately not snapshot comparisons, because the data legitimately changes
# every quarter and a check that cries wolf gets ignored.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # No dependencies of their own -- these run against the committed data.
      - name: Unit tests
        run: npm test

      - name: Label invariants
        run: node scripts/audit-labels.mjs --check

      - name: Statement presentation invariants
        run: node scripts/audit-presentation.mjs --check

      - name: Build
        env:
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          VITE_CONTACT_EMAIL: ${{ secrets.VITE_CONTACT_EMAIL }}
        run: npm run build
