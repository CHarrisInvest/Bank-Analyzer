name: Update SEC Data

on:
  schedule:
    # Run daily at 3am UTC (after SEC data typically updates)
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    outputs:
      new_asset: ${{ steps.check.outputs.new_asset }}
      pending: ${{ steps.check.outputs.pending }}
      expected: ${{ steps.check.outputs.expected }}
      behind: ${{ steps.check.outputs.behind }}
      blocked: ${{ steps.check.outputs.blocked }}
      deploy: ${{ steps.commit.outputs.changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ============================================
      # Decide whether a rebuild is needed. The trigger is the sec-data
      # release contents vs. the quarters already processed into the repo
      # (metadata.quartersProcessed in sec-data-index.json). A new quarter
      # on the release -- whether uploaded manually or pulled from SEC by the
      # best-effort step below -- triggers exactly one rebuild.
      #
      # NOTE: SEC blocks datacenter IPs (GitHub-hosted runners) with HTTP 403,
      # so the SEC auto-download is opportunistic only; on GitHub-hosted
      # runners new quarters are expected to be uploaded to the release
      # manually. A self-hosted runner would let the auto-download work.
      #
      # Because that manual upload is easy to forget, this step also works out
      # which quarter SEC *should* have published by now and records the gap in
      # the "behind" output. The report-freshness job below turns a non-empty
      # gap into a failure, so the site silently serving months-old quarters
      # shows up as a red run instead of a green no-op.
      # ============================================
      - name: Check for new quarterly data
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          # SEC's fair-access policy expects a declared contact in the
          # User-Agent; reuse the project's contact email (SEC_CONTACT_EMAIL
          # is an optional dedicated override).
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
          VITE_CONTACT_EMAIL: ${{ secrets.VITE_CONTACT_EMAIL }}
        run: |
          set -euo pipefail

          CONTACT="${SEC_CONTACT_EMAIL:-${VITE_CONTACT_EMAIL:-}}"
          if [ -n "$CONTACT" ]; then
            UA="Bank-Analyzer/1.0 (${CONTACT}; +https://github.com/${GITHUB_REPOSITORY})"
          else
            UA="Bank-Analyzer/1.0 (+https://github.com/${GITHUB_REPOSITORY})"
          fi
          BASE_URL="https://www.sec.gov/files/dera/data/financial-statement-data-sets"
          INDEX_FILE="public/data/sec-data-index.json"

          # Quarters already processed into the repo, normalised to "2026Q1".
          processed="$(jq -r '.metadata.quartersProcessed[]? // empty' "$INDEX_FILE" 2>/dev/null \
            | tr '[:lower:]' '[:upper:]' | sort -u || true)"

          # Quarterly zips currently on the sec-data release, same normal form.
          release_q="$(gh release view sec-data --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' 2>/dev/null \
            | grep -oiE '^[0-9]{4}q[1-4]\.zip$' \
            | sed -E 's/\.[Zz][Ii][Pp]$//' \
            | tr '[:lower:]' '[:upper:]' | sort -u || true)"

          echo "Quarters already processed in repo:"; echo "${processed:-  <none>}"
          echo "Quarterly assets on the sec-data release:"; echo "${release_q:-  <none>}"

          # "2026Q2" <-> 20262, so quarters compare and increment as integers.
          code_of() { echo "$1" | sed -E 's/Q/ /' | awk '{ printf "%d", $1 * 10 + $2 }'; }
          label_of() { printf '%dQ%d' $(( $1 / 10 )) $(( $1 % 10 )); }
          next_code() {
            local y=$(( $1 / 10 )) q=$(( $1 % 10 ))
            q=$(( q + 1 )); if [ "$q" -gt 4 ]; then q=1; y=$(( y + 1 )); fi
            echo $(( y * 10 + q ))
          }

          # Newest quarter SEC should have published by now. DERA posts a
          # quarter's dataset roughly 5-6 weeks after the quarter closes, so a
          # quarter counts as due once 45 days have passed since its end.
          now="$(date -u +%s)"
          ey="$(date -u +%Y)"; eq=$(( ($(date -u +%-m) + 2) / 3 ))
          expected=""
          for _ in 1 2 3 4 5 6 7 8; do
            eq=$(( eq - 1 )); if [ "$eq" -lt 1 ]; then eq=4; ey=$(( ey - 1 )); fi
            case "$eq" in
              1) qend="${ey}-03-31" ;;
              2) qend="${ey}-06-30" ;;
              3) qend="${ey}-09-30" ;;
              4) qend="${ey}-12-31" ;;
            esac
            if [ "$(date -u -d "${qend} +45 days" +%s)" -le "$now" ]; then
              expected="${ey}Q${eq}"
              break
            fi
          done
          echo "Newest quarter SEC should have published by now: ${expected:-<unknown>}"

          # Best-effort: pull any SEC quarter the release is missing, up to the
          # one that is due. Ask for the zip directly rather than probing with
          # HEAD first: the probe cost a request, and a HEAD that SEC rejects
          # made a reachable SEC look unreachable. The response code on the
          # real download tells us what actually happened.
          blocked=""
          if [ -n "$release_q" ] && [ -n "$expected" ]; then
            have="$(echo "$release_q" | sed -E 's/Q/ /' \
              | awk '{ printf "%d\n", $1 * 10 + $2 }' | sort -n | tail -1)"
            want="$(code_of "$expected")"
            cand="$(next_code "$have")"
            while [ "$cand" -le "$want" ]; do
              y=$(( cand / 10 )); q=$(( cand % 10 ))
              name="${y}q${q}.zip"
              code="$(curl -sSL -A "$UA" -o "$name" -w '%{http_code}' "${BASE_URL}/${name}" || echo 000)"
              if [ "$code" = "200" ] && unzip -t "$name" >/dev/null 2>&1; then
                gh release upload sec-data "$name" --repo "$GITHUB_REPOSITORY" --clobber
                release_q="$(printf '%s\n%s' "$release_q" "$(label_of "$cand")" | sort -u)"
                echo "::notice::Synced new SEC quarter to release: ${name}"
                rm -f "$name"
                cand="$(next_code "$cand")"
                continue
              fi
              rm -f "$name"
              case "$code" in
                401|403)
                  blocked="$code"
                  echo "SEC refused ${name} (HTTP ${code}) -- this runner's IP is blocked. Upload the zip to the sec-data release by hand."
                  ;;
                404) echo "SEC has not published ${name} yet (HTTP 404)." ;;
                200) echo "Downloaded ${name} but it is not a valid zip; ignoring." ;;
                *)   echo "Could not download ${name} (HTTP ${code})." ;;
              esac
              break
            done
          fi

          # Reprocess when the release holds a quarter the repo hasn't processed.
          pending="$(comm -23 <(echo "$release_q") <(echo "$processed") | sed '/^$/d')"
          if [ -n "$pending" ]; then
            echo "::notice::New quarter(s) on the release to process: $(echo $pending | tr '\n' ' ')"
            echo "new_asset=true" >> "$GITHUB_OUTPUT"
          else
            echo "No unprocessed quarters on the release; skipping rebuild."
            echo "new_asset=false" >> "$GITHUB_OUTPUT"
          fi
          echo "pending=$(echo $pending | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

          # How far behind SEC the data will still be once this run finishes.
          # Everything on the release gets processed, so the newest quarter we
          # will hold is the newest of (processed, release).
          behind=""
          newest="$(printf '%s\n%s\n' "$processed" "$release_q" | sed '/^$/d' \
            | sed -E 's/Q/ /' | awk '{ printf "%d\n", $1 * 10 + $2 }' | sort -n | tail -1)"
          if [ -n "$expected" ] && [ -n "$newest" ] && [ "$newest" -lt "$(code_of "$expected")" ]; then
            cand="$(next_code "$newest")"
            while [ "$cand" -le "$(code_of "$expected")" ]; do
              behind="${behind}${behind:+ }$(label_of "$cand")"
              cand="$(next_code "$cand")"
            done
            echo "::warning::Bank data is behind SEC: missing ${behind}"
          fi
          echo "expected=${expected}" >> "$GITHUB_OUTPUT"
          echo "behind=${behind}" >> "$GITHUB_OUTPUT"
          echo "blocked=${blocked}" >> "$GITHUB_OUTPUT"

      # ============================================
      # SEC Financial Statement Data Sets Processing
      # Only the heavy zip download + reprocessing is gated on a new
      # quarter; the daily EDGAR exchange refresh below always runs.
      # ============================================
      - name: Download SEC FS Data Sets from release
        if: steps.check.outputs.new_asset == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Downloading SEC Financial Statement Data Sets from release..."
          mkdir -p .sec-data-cache

          # Download all ZIP files from sec-data release
          gh release download sec-data --pattern "*.zip" --dir .sec-data-cache 2>/dev/null || {
            echo "Warning: Could not download from sec-data release"
            echo "Please ensure the release exists with quarterly ZIP files (e.g., 2025q3.zip)"
            exit 1
          }

          echo "Downloaded files:"
          ls -la .sec-data-cache/

      - name: Process SEC FS Data Sets
        if: steps.check.outputs.new_asset == 'true'
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
          VITE_CONTACT_EMAIL: ${{ secrets.VITE_CONTACT_EMAIL }}
        run: |
          echo "Processing SEC Financial Statement Data Sets..."
          node --expose-gc scripts/fetch-sec-fs-datasets.cjs --verbose

      # Runs every day regardless of new quarterly data: exchange listings
      # change independently of the quarterly financial statement datasets.
      - name: Update exchange data from SEC EDGAR
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
          VITE_CONTACT_EMAIL: ${{ secrets.VITE_CONTACT_EMAIL }}
        run: |
          echo "Refreshing exchange data from SEC EDGAR submissions API..."
          node scripts/update-exchanges.cjs

      # ============================================
      # Commit and Deploy
      # ============================================
      - name: Commit updated data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add data files (individual bank files in banks/ directory, plus index)
          git add public/data/banks.json public/data/sec-data-index.json
          # Add individual bank data files
          if [ -d "public/data/banks" ]; then
            git add public/data/banks/
          fi

          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Update bank data from SEC FS Data Sets - $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "✓ Changes committed and pushed"
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.commit.outputs.changed == 'true'
        run: npm ci

      - name: Build site
        if: steps.commit.outputs.changed == 'true'
        env:
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          VITE_CONTACT_EMAIL: ${{ secrets.VITE_CONTACT_EMAIL }}
        run: npm run build

      - name: Commit regenerated sitemap
        if: steps.commit.outputs.changed == 'true'
        run: |
          git add public/sitemap.xml
          if ! git diff --staged --quiet; then
            git commit -m "Regenerate sitemap after data update"
            git push
          fi

      - name: Setup Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: needs.update-data.outputs.deploy == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: update-data
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify IndexNow (Bing, Yandex)
        if: success()
        continue-on-error: true
        run: |
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            -d '{
              "host": "banksift.org",
              "key": "209cecf4aae383ab7121af6cbfe2248e",
              "keyLocation": "https://banksift.org/209cecf4aae383ab7121af6cbfe2248e.txt",
              "urlList": [
                "https://banksift.org/",
                "https://banksift.org/screener",
                "https://banksift.org/screener/guide",
                "https://banksift.org/search",
                "https://banksift.org/metrics",
                "https://banksift.org/valuation",
                "https://banksift.org/glossary"
              ]
            }'

  # ============================================
  # Fail the run when the site is serving quarters older than the newest one
  # SEC has published. This is a separate job on purpose: a stale-data failure
  # must not gate the deploy of whatever data we *do* have.
  # ============================================
  report-freshness:
    if: always() && needs.update-data.outputs.behind != ''
    runs-on: ubuntu-latest
    needs: update-data
    steps:
      - name: Report missing SEC quarters
        env:
          BEHIND: ${{ needs.update-data.outputs.behind }}
          EXPECTED: ${{ needs.update-data.outputs.expected }}
          BLOCKED: ${{ needs.update-data.outputs.blocked }}
        run: |
          set -euo pipefail
          BASE_URL="https://www.sec.gov/files/dera/data/financial-statement-data-sets"

          {
            echo "## Bank data is behind SEC"
            echo
            echo "Missing quarter(s): \`${BEHIND}\` (newest published by SEC: \`${EXPECTED}\`)"
            echo
            if [ -n "$BLOCKED" ]; then
              echo "SEC refused this runner's download with HTTP ${BLOCKED}: GitHub-hosted"
              echo "runners come from datacenter IPs that SEC blocks, so the zips have to be"
              echo "added to the \`sec-data\` release by hand."
              echo
            fi
            echo "To fix, from a machine SEC will serve:"
            echo
            echo '```sh'
            for q in $BEHIND; do
              name="$(echo "$q" | tr '[:upper:]' '[:lower:]').zip"
              echo "curl -O -A 'Bank-Analyzer/1.0 (your@email)' ${BASE_URL}/${name}"
              echo "gh release upload sec-data ${name} --repo ${GITHUB_REPOSITORY} --clobber"
            done
            echo '```'
            echo
            echo "The next scheduled run (or a manual re-run of this workflow) picks the"
            echo "new zips up, reprocesses, and redeploys."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error::Bank data is behind SEC -- missing ${BEHIND}. See the job summary for the upload steps."
          exit 1
