name: Update SEC Data

on:
  schedule:
    # Run daily at 3am UTC (after SEC data typically updates)
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    outputs:
      new_asset: ${{ steps.check.outputs.new_asset }}
      pending: ${{ steps.check.outputs.pending }}
      deploy: ${{ steps.commit.outputs.changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ============================================
      # Decide whether a rebuild is needed. The trigger is the sec-data
      # release contents vs. the quarters already processed into the repo
      # (metadata.quartersProcessed in sec-data-index.json). A new quarter
      # on the release -- whether uploaded manually or pulled from SEC by the
      # best-effort step below -- triggers exactly one rebuild.
      #
      # NOTE: SEC blocks datacenter IPs (GitHub-hosted runners) with HTTP 403,
      # so the SEC auto-download is opportunistic only; on GitHub-hosted
      # runners new quarters are expected to be uploaded to the release
      # manually. A self-hosted runner would let the auto-download work.
      # ============================================
      - name: Check for new quarterly data
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          # SEC's fair-access policy expects a declared contact in the
          # User-Agent; reuse the project's contact email (SEC_CONTACT_EMAIL
          # is an optional dedicated override).
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
          VITE_CONTACT_EMAIL: ${{ secrets.VITE_CONTACT_EMAIL }}
        run: |
          set -euo pipefail

          CONTACT="${SEC_CONTACT_EMAIL:-${VITE_CONTACT_EMAIL:-}}"
          if [ -n "$CONTACT" ]; then
            UA="Bank-Analyzer/1.0 (${CONTACT}; +https://github.com/${GITHUB_REPOSITORY})"
          else
            UA="Bank-Analyzer/1.0 (+https://github.com/${GITHUB_REPOSITORY})"
          fi
          BASE_URL="https://www.sec.gov/files/dera/data/financial-statement-data-sets"
          INDEX_FILE="public/data/sec-data-index.json"

          # Quarters already processed into the repo, normalised to "2026Q1".
          processed="$(jq -r '.metadata.quartersProcessed[]? // empty' "$INDEX_FILE" 2>/dev/null \
            | tr '[:lower:]' '[:upper:]' | sort -u || true)"

          # Quarterly zips currently on the sec-data release, same normal form.
          release_q="$(gh release view sec-data --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' 2>/dev/null \
            | grep -oiE '^[0-9]{4}q[1-4]\.zip$' \
            | sed -E 's/\.[Zz][Ii][Pp]$//' \
            | tr '[:lower:]' '[:upper:]' | sort -u || true)"

          echo "Quarters already processed in repo:"; echo "${processed:-  <none>}"
          echo "Quarterly assets on the sec-data release:"; echo "${release_q:-  <none>}"

          # Best-effort: pull any newly published SEC quarter into the release.
          # SEC blocks datacenter IPs, so treat any failure as "not available"
          # and fall back to whatever is already on the release.
          if [ -n "$release_q" ]; then
            latest="$(echo "$release_q" | sed -E 's/Q/ /' \
              | awk '{ printf "%d\n", $1 * 10 + $2 }' | sort -n | tail -1)"
            y=$(( latest / 10 )); q=$(( latest % 10 ))
            probe="$(curl -sSL -A "$UA" -I -o /dev/null -w '%{http_code}' "${BASE_URL}/${y}q${q}.zip" || echo 000)"
            if [ "$probe" = "200" ]; then
              cur_code=$(( $(date -u +%Y) * 10 + ( ($(date -u +%-m) + 2) / 3 ) ))
              while : ; do
                q=$(( q + 1 )); if [ "$q" -gt 4 ]; then q=1; y=$(( y + 1 )); fi
                [ $(( y * 10 + q )) -gt "$cur_code" ] && break
                name="${y}q${q}.zip"
                code="$(curl -sSL -A "$UA" -o "$name" -w '%{http_code}' "${BASE_URL}/${name}" || echo 000)"
                if [ "$code" != "200" ]; then rm -f "$name"; break; fi
                if unzip -t "$name" >/dev/null 2>&1; then
                  gh release upload sec-data "$name" --repo "$GITHUB_REPOSITORY" --clobber
                  release_q="$(printf '%s\n%s' "$release_q" "${y}Q${q}" | sort -u)"
                  echo "::notice::Synced new SEC quarter to release: ${name}"
                fi
                rm -f "$name"
              done
            else
              echo "SEC not reachable from this runner (HTTP ${probe}); using release contents only. Upload new quarterly zips to the sec-data release manually if SEC blocks the runner."
            fi
          fi

          # Reprocess when the release holds a quarter the repo hasn't processed.
          pending="$(comm -23 <(echo "$release_q") <(echo "$processed") | sed '/^$/d')"
          if [ -n "$pending" ]; then
            echo "::notice::New quarter(s) on the release to process: $(echo $pending | tr '\n' ' ')"
            echo "new_asset=true" >> "$GITHUB_OUTPUT"
          else
            echo "No unprocessed quarters on the release; skipping rebuild."
            echo "new_asset=false" >> "$GITHUB_OUTPUT"
          fi
          echo "pending=$(echo $pending | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      # ============================================
      # SEC Financial Statement Data Sets Processing
      # Only the heavy zip download + reprocessing is gated on a new
      # quarter; the daily EDGAR exchange refresh below always runs.
      # ============================================
      - name: Download SEC FS Data Sets from release
        if: steps.check.outputs.new_asset == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Downloading SEC Financial Statement Data Sets from release..."
          mkdir -p .sec-data-cache

          # Download all ZIP files from sec-data release
          gh release download sec-data --pattern "*.zip" --dir .sec-data-cache 2>/dev/null || {
            echo "Warning: Could not download from sec-data release"
            echo "Please ensure the release exists with quarterly ZIP files (e.g., 2025q3.zip)"
            exit 1
          }

          echo "Downloaded files:"
          ls -la .sec-data-cache/

      - name: Process SEC FS Data Sets
        if: steps.check.outputs.new_asset == 'true'
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
          VITE_CONTACT_EMAIL: ${{ secrets.VITE_CONTACT_EMAIL }}
        run: |
          echo "Processing SEC Financial Statement Data Sets..."
          node --expose-gc scripts/fetch-sec-fs-datasets.cjs --verbose

      # Runs every day regardless of new quarterly data: exchange listings
      # change independently of the quarterly financial statement datasets.
      - name: Update exchange data from SEC EDGAR
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
          VITE_CONTACT_EMAIL: ${{ secrets.VITE_CONTACT_EMAIL }}
        run: |
          echo "Refreshing exchange data from SEC EDGAR submissions API..."
          node scripts/update-exchanges.cjs

      # ============================================
      # Commit and Deploy
      # ============================================
      - name: Commit updated data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add data files (individual bank files in banks/ directory, plus index)
          git add public/data/banks.json public/data/sec-data-index.json
          # Add individual bank data files
          if [ -d "public/data/banks" ]; then
            git add public/data/banks/
          fi

          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Update bank data from SEC FS Data Sets - $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "✓ Changes committed and pushed"
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.commit.outputs.changed == 'true'
        run: npm ci

      - name: Build site
        if: steps.commit.outputs.changed == 'true'
        env:
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          VITE_CONTACT_EMAIL: ${{ secrets.VITE_CONTACT_EMAIL }}
        run: npm run build

      - name: Commit regenerated sitemap
        if: steps.commit.outputs.changed == 'true'
        run: |
          git add public/sitemap.xml
          if ! git diff --staged --quiet; then
            git commit -m "Regenerate sitemap after data update"
            git push
          fi

      - name: Setup Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: needs.update-data.outputs.deploy == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: update-data
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify IndexNow (Bing, Yandex)
        if: success()
        continue-on-error: true
        run: |
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            -d '{
              "host": "banksift.org",
              "key": "209cecf4aae383ab7121af6cbfe2248e",
              "keyLocation": "https://banksift.org/209cecf4aae383ab7121af6cbfe2248e.txt",
              "urlList": [
                "https://banksift.org/",
                "https://banksift.org/screener",
                "https://banksift.org/screener/guide",
                "https://banksift.org/search",
                "https://banksift.org/metrics",
                "https://banksift.org/valuation",
                "https://banksift.org/glossary"
              ]
            }'
